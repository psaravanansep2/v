name: CI

on:
  push:
    branches: [main, voice-assistant]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[phone,free,dev]" numpy
      - run: python -m pytest -q

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      V_SKIP_MODEL: "1"
      V_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: V_SOURCE="file://$GITHUB_WORKSPACE" sh ./install.sh
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:V_SOURCE = "file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          ./install.ps1
      - name: The installed v works
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$(cygpath -u "$USERPROFILE")/.local/bin:$PATH"; fi
          export PATH="$HOME/.local/bin:$PATH"
          v --help
          v doctor
      - name: The icon was created
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test -x "$HOME/Applications/v.app/Contents/MacOS/v" ;;
            Linux) test -f "$HOME/.local/share/applications/v.desktop" ;;
            Windows) test -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/v.lnk" ;;
          esac

  real-model:
    name: real free model via ${{ matrix.runner }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ollama, llama.cpp]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[free,local]"
      - name: Install Ollama and the model
        if: matrix.runner == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 5
          ollama pull qwen3:4b
      - name: llama.cpp release downloads (for the record)
        if: matrix.runner == 'llama.cpp'
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=3" \
            | python -c "import json, sys; [print(r['tag_name'], len(r['assets']), [a['name'] for a in r['assets']][:12]) for r in json.load(sys.stdin)]"
      - name: v check with a real model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: v check --local-model qwen3:4b
      - name: v's own model server log
        if: failure() && matrix.runner == 'llama.cpp'
        run: ls -la ~/.v/local ~/.v/local/models || true
