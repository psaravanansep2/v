name: CI

on:
  push:
    branches: [main, voice-assistant]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[phone,free,dev]" numpy
      - run: python -m pytest -q

  ui:
    name: app pages in a real browser (computer and phone sizes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[phone,free,dev]" numpy playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_ui.py

  downloads:
    name: every model download exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rw tests/test_downloads.py
        env:
          V_NETWORK_TESTS: "1"

  training:
    name: training pipeline end to end (tiny model, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[free,local,dev]" -r training/requirements.txt
      - name: Make training examples
        run: python training/make_data.py --families read,find,write --per-family 2 --out data/train.jsonl
      - name: Train Qwen3 0.6B for a few passes over them
        run: python training/finetune.py --base Qwen/Qwen3-0.6B --data data/train.jsonl --out run --max-steps 18 --grad-accum 1 --lr 1e-3 --cpu
      - name: It learned (average loss, first pass vs last)
        run: |
          python - <<'PY'
          import json
          losses = json.load(open("run/metrics.json"))["losses"]
          first, last = sum(losses[:6]) / 6, sum(losses[-6:]) / 6
          print(f"{first:.3f} -> {last:.3f}")
          assert last < first * 0.9, losses
          PY
      - name: Score it with v eval through the training server
        run: |
          python training/serve_hf.py --model run/merged --port 8000 --max-new-tokens 200 > serve.log 2>&1 &
          for i in $(seq 150); do curl -sf http://127.0.0.1:8000/v1/models && break; sleep 2; done
          v eval --local-url http://127.0.0.1:8000 --families question,read --json tiny-hf.json
      - name: Make a GGUF and run it in v
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python training/export_gguf.py --model run/merged --out tiny-Q4_K_M.gguf
          v eval --local-model ./tiny-Q4_K_M.gguf --families question,read --json tiny-gguf.json
      - name: Server log
        if: failure()
        run: tail -60 serve.log || true

  gpt-oss:
    name: v eval with gpt-oss 20B (what v picks for many 16-32 GB computers)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make room for the 12 GB model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: python -m pip install -e ".[free,local]"
      - name: v eval through v's own llama.cpp runner (a measurement, not a pass/fail gate)
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: v eval --local-model gpt-oss:20b --families site,write,edit,read,question,refuse --json eval-gpt-oss-20b.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gpt-oss-20b
          path: eval-gpt-oss-20b.json

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      V_SKIP_MODEL: "1"
      V_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: V_SOURCE="file://$GITHUB_WORKSPACE" sh ./install.sh
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:V_SOURCE = "file:///" + ($env:GITHUB_WORKSPACE -replace '\\', '/')
          ./install.ps1
      - name: The installed v works
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$(cygpath -u "$USERPROFILE")/.local/bin:$PATH"; fi
          export PATH="$HOME/.local/bin:$PATH"
          v --help
          v doctor
      - name: The icon was created
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test -x "$HOME/Applications/v.app/Contents/MacOS/v" ;;
            Linux) test -f "$HOME/.local/share/applications/v.desktop" ;;
            Windows) test -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/v.lnk" ;;
          esac

  real-model:
    name: real free model via ${{ matrix.runner }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        runner: [ollama, llama.cpp]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[free,local]"
      - name: Install Ollama and the model
        if: matrix.runner == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) ; sleep 5
          ollama pull qwen3:4b-instruct-2507-q4_K_M
      - name: llama.cpp release downloads (for the record)
        if: matrix.runner == 'llama.cpp'
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=3" \
            | python -c "import json, sys; [print(r['tag_name'], len(r['assets']), [a['name'] for a in r['assets']][:12]) for r in json.load(sys.stdin)]"
      - name: v check with a real model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: v check --local-model ${{ matrix.runner == 'ollama' && 'qwen3:4b-instruct-2507-q4_K_M' || 'qwen3:4b' }}
      - name: v eval with a real model (everyday tasks; a measurement, not a pass/fail gate)
        # on v's own llama.cpp runner, which reuses what it already read (on this CPU-only machine,
        # Ollama re-reads the whole conversation each step and the tasks don't fit in the time)
        if: matrix.runner == 'llama.cpp'
        timeout-minutes: 50
        run: v eval --local-model qwen3:4b --json eval-qwen3-4b.json
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'llama.cpp' && always()
        with:
          name: eval-qwen3-4b
          path: eval-qwen3-4b.json
      - name: llama.cpp can keep a big model's experts in RAM (--cpu-moe)
        if: matrix.runner == 'llama.cpp'
        run: |
          server=$(find ~/.v/local/bin -name llama-server -type f | head -1)
          "$server" --help 2>&1 | grep -- "--cpu-moe"
      - name: v's own model server log
        if: failure() && matrix.runner == 'llama.cpp'
        run: ls -la ~/.v/local ~/.v/local/models || true
