[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v"
version = "0.1.0"
description = "Free voice assistant that talks with you, works on your computer and files, and runs on open models on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.12.0"]

[project.optional-dependencies]
# Microphone + speech recognition + spoken replies. Kokoro (the natural voice)
# doesn't publish wheels for Python 3.13 yet; there v falls back to pyttsx3,
# which uses the operating system's built-in voices.
voice = [
    "numpy",
    "sounddevice",
    "faster-whisper",
    "kokoro>=0.9.4; python_version < '3.13'",
    "pyttsx3",
]
# Screenshots + mouse/keyboard control.
computer = ["pyautogui", "mss", "pillow"]
# Use a phone as v's mic, speaker and screen: QR code + HTTPS certificate.
phone = ["qrcode", "cryptography"]
# The free brain: v's own model runner (not needed if you use Ollama or LM
# Studio), reading text off the screen, and reading PDFs.
local = ["cheapstack @ git+https://github.com/psaravanansep2/cheapstack"]
free = ["rapidocr_onnxruntime", "pypdf"]
all = ["v[voice,computer,phone,local,free]"]
dev = ["pytest"]

[project.scripts]
v = "v.cli:main"

[tool.setuptools.packages.find]
include = ["v*"]

[tool.setuptools.package-data]
v = ["phone.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
