[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v"
version = "0.1.0"
description = "Free voice assistant that talks with you, works on your computer and files, and runs on open models on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.12.0"]

[project.optional-dependencies]
# Microphone + speech recognition + spoken replies (the computer's built-in
# voice). In the app window and on phones, the browser's voice is used.
voice = ["numpy", "sounddevice", "faster-whisper", "pyttsx3"]
# The most natural voice. It needs PyTorch (a large download), so it's
# separate, and Kokoro doesn't support Python 3.13 yet.
kokoro = ["kokoro>=0.9.4; python_version < '3.13'"]
# Screenshots + mouse/keyboard control.
computer = ["pyautogui", "mss", "pillow"]
# Use a phone as v's mic, speaker and screen: QR code + HTTPS certificate.
phone = ["qrcode", "cryptography"]
# v's own model runner (not needed with Ollama or LM Studio). A zip archive,
# so installing needs no git.
local = ["cheapstack @ https://github.com/psaravanansep2/cheapstack/archive/refs/heads/master.zip"]
# Reading text off the screen, and reading PDFs.
free = ["rapidocr_onnxruntime", "pypdf", "pillow"]
all = ["v[voice,computer,phone,local,free]"]
dev = ["pytest"]

[project.scripts]
v = "v.cli:main"

[tool.setuptools.packages.find]
include = ["v*"]

[tool.setuptools.package-data]
v = ["phone.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
